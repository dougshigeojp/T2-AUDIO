<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEENS 2 AUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-audio.css">
</head>
<body>

    <header>
        <button id="menu-toggle">☰</button>
        <h1>TEENS 2 AUDIO</h1>
    </header>

    <nav id="sidebar">
        <div class="sidebar-header">TEENS 2 - UNITS</div>
        <ul class="sidebar-list" id="group-list"></ul>
    </nav>

    <main class="content-container">
        <h2 id="current-group-label" style="margin-bottom: 20px; color: var(--deep-blue);"></h2>
        <div id="lesson-container">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <div id="player-bar">
        <div id="current-track-title">Select an audio track...</div>
        <audio id="main-audio-player" controls preload="auto"></audio>
    </div>

    <script src="audio-data.js"></script>
    <script>
        const audioPlayer = document.getElementById('main-audio-player');
        const trackTitle = document.getElementById('current-track-title');
        
        // Initialize Web Audio Context to bypass Chromium MP3 decoding flaws
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let currentBlobUrl = null;

        function init() {
            renderSidebar();
            loadGroup("R1");
            setupMenu();
        }

        function renderSidebar() {
            const list = document.getElementById('group-list');
            list.innerHTML = Object.keys(AUDIO_DATABASE).map(key => `
                <li onclick="loadGroup('${key}')">${AUDIO_DATABASE[key].label}</li>
            `).join('');
        }

        function loadGroup(groupId) {
            const groupData = AUDIO_DATABASE[groupId];

            // Check password if required
            if (groupData.requiresPassword) {
                const userInput = prompt("This section is password protected. Enter Code:");
                if (userInput !== groupData.password) {
                    alert("Incorrect Password. Access Denied.");
                    return;
                }
                alert("Access Granted!");
            }

            // Render lesson cards
            document.getElementById('current-group-label').innerText = groupData.label;
            const container = document.getElementById('lesson-container');
            
            container.innerHTML = groupData.lessons.map(lesson => `
                <div class="lesson-card ${lesson.isReview ? 'review-card' : ''}">
                    <div class="card-header">
                        <span class="lesson-id">${lesson.id}</span>
                        <span class="lesson-title">${lesson.title}</span>
                    </div>
                    <div class="button-grid">
                        ${lesson.tracks.map(track => `
                            <button class="track-btn" 
                                onclick="playAudio('${track.file}', '${lesson.id} - ${track.label}', this)">
                                ${track.label}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            document.getElementById('sidebar').classList.remove('active');
            window.scrollTo(0,0);
        }

        // Helper function: Converts raw decoded audio into a lossless playable stream
        function audioBufferToWav(buffer) {
            let numChannels = buffer.numberOfChannels,
                sampleRate = buffer.sampleRate,
                format = 1, // PCM
                bitDepth = 16,
                bytesPerSample = bitDepth / 8,
                blockAlign = numChannels * bytesPerSample,
                wavDataByteLength = buffer.length * blockAlign,
                headerByteLength = 44,
                totalLength = headerByteLength + wavDataByteLength,
                waveData = new Uint8Array(totalLength),
                view = new DataView(waveData.buffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + wavDataByteLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, wavDataByteLength, true);

            let channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = channels[channel][i];
                    sample = Math.max(-1, Math.min(1, sample));
                    sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
            }
            return new Blob([waveData], { type: 'audio/wav' });
        }

        // Play audio with full pauses preserved
window.playAudio = function(file, fullTitle, btnElement) {
            // UI Update
            document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // Audio Update
            trackTitle.innerText = fullTitle;
            audioPlayer.src = `audio/${file}`;
        };
        function setupMenu() {
            document.getElementById('menu-toggle').onclick = (e) => {
                e.stopPropagation();
                document.getElementById('sidebar').classList.toggle('active');
            };
            document.addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('active');
            });
            document.getElementById('sidebar').onclick = (e) => e.stopPropagation();
        }

        init();
    </script>
</body>
</html>
